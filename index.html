<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMK Pariwisata Puspa Wisata PGRI Serpong - Sistem Presensi & Jadwal</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2A221B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Presensi SMK">

  <!-- Favicon Sekolah Resmi -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      /* Background kanvas gelap: Menelan celah 1px putih Google hingga hilang 100% */
      background-color: #2A221B;
    }

    /* Iframe Layar Penuh Tanpa Border */
    #portalFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Iframe pemanggil Web App Google Apps Script dengan delegasi izin standar W3C -->
  <iframe 
    id="portalFrame"
    src="https://script.google.com/macros/s/AKfycbx1ENrWfgYxiNQZ2Hd7BVQZFBjxlW106TKjYQWoxaWeEjE0dNQlDMRkFMSTUi7zkrGd/exec" 
    allow="camera; microphone; geolocation; fullscreen; display-capture; autoplay"
    title="Portal Presensi SMK Puspa Wisata">
  </iframe>

  <script>
    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.log('SW registration failed:', err);
        });
      });
    }

    // Memastikan izin Kamera & GPS terdaftar pada level OS Android untuk mode Installed PWA
    (function() {
      function requestParentPermissions() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
              stream.getTracks().forEach(function(track) { track.stop(); });
            })
            .catch(function(err) {
              console.log('Camera permission check:', err);
            });
        }
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function() {}, function() {});
        }
      }

      window.addEventListener('click', function onFirstTouch() {
        requestParentPermissions();
        window.removeEventListener('click', onFirstTouch);
      }, { once: true });

      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        setTimeout(requestParentPermissions, 1000);
      }
    })();
  </script>
</body>
</html>
